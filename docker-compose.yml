services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: medplab-backend
    ports:
      - "8000:8000"
    volumes:
      - ./Data:/app/Data
      - ./Scripts:/app/Scripts
      - ./main.py:/app/main.py
      - ./schemas:/app/schemas
      - hf_cache:/root/.cache/huggingface
    environment:
      - HF_HOME=/root/.cache/huggingface
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: medplab-frontend
    ports:
      - "8501:8501"
    volumes:
      - ./streamlit_app.py:/app/streamlit_app.py
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  hf_cache:
    name: medplab_hf_cache
